<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · İntens İnşaat · Mühendislik</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #08090A url("/intens-poster.jpg") center / cover no-repeat;
  }
  .page {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-family: "Archivo", system-ui, sans-serif;
    font-stretch: 125%;
    text-align: center;
    white-space: nowrap;
  }
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2em;
    font-size: clamp(40px, 10vw, 180px);
    color: inherit;
    text-decoration: none;
  }
  .logo-name {
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-right: -0.04em;
    color: #E4E7EA;
    line-height: 1;
  }
  .logo-tag {
    font-size: clamp(9px, 1.15vw, 22px);
    font-weight: 500;
    letter-spacing: 0.42em;
    margin-right: -0.42em;
    color: #C29A62;
    line-height: 1;
  }
  .message {
    margin: clamp(40px, 7vw, 96px) 0 0;
    font-size: clamp(11px, 1.2vw, 20px);
    font-weight: 500;
    letter-spacing: 0.3em;
    margin-right: -0.3em;
    color: #E4E7EA;
    opacity: 0.7;
    line-height: 1;
  }
  .home {
    margin-top: clamp(16px, 2vw, 28px);
    padding: 0.9em 1.6em;
    font-size: clamp(10px, 1vw, 16px);
    font-weight: 500;
    letter-spacing: 0.3em;
    color: #C29A62;
    text-decoration: none;
    border: 1px solid rgba(194, 154, 98, 0.45);
    transition: border-color 0.2s, color 0.2s;
  }
  .home:hover, .home:focus-visible {
    color: #E4E7EA;
    border-color: #E4E7EA;
    outline: none;
  }
</style>
</head>
<body>
  <main class="page">
    <a class="logo" href="/" aria-label="İntens İnşaat Mühendislik — ana sayfa">
      <span class="logo-name">İNTENS</span>
      <span class="logo-tag">İNŞAAT · MÜHENDİSLİK</span>
    </a>
    <h1 class="message">SAYFA BULUNAMADI</h1>
    <a class="home" href="/">ANA SAYFAYA DÖN</a>
  </main>
</body>
</html>
