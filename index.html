<style>

  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #08090A;

  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .logo {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.2em;
    padding: 0 16px;
    font-family: "Archivo", system-ui, sans-serif;
    font-stretch: 125%;
    font-size: clamp(48px, 14vw, 280px);
    text-align: center;
    white-space: nowrap;
  }
  .logo-name {
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-right: -0.04em;
    color: #E4E7EA;
    line-height: 1;
  }
  .logo-tag {
    font-size: clamp(10px, 1.6vw, 30px);
    font-weight: 500;
    letter-spacing: 0.42em;
    margin-right: -0.42em;
    color: #C29A62;
    line-height: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    .bg { display: none; }
    body {
      background: #08090A url("intens-poster.jpg") center / cover no-repeat;
    }
  }
